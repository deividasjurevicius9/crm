# Git hooks: https://lefthook.dev/configuration/
# Fast checks on staged files before every commit. The full `pnpm check`
# (tests, coverage, test ratio, build) runs in CI on every push.
pre-commit:
  parallel: true
  jobs:
    - name: prettier
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

    - name: eslint
      glob: "*.{ts,tsx,mts,js,mjs}"
      run: pnpm exec eslint --max-warnings=0 {staged_files}

    - name: typecheck
      glob: "*.{ts,tsx,mts}"
      run: pnpm typecheck
